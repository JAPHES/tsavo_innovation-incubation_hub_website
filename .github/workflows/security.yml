name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-used-by-any-real-deployment-123456789"
      DATABASE_URL: "sqlite:///db.sqlite3"
      ALLOWED_HOSTS: "testserver,localhost"
      CSRF_TRUSTED_ORIGINS: "https://testserver"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
      - name: Check production settings
        run: python manage.py check --deploy
      - name: Run tests
        run: python manage.py test
      - name: Audit direct and transitive dependencies
        run: python -m pip_audit -r requirements.txt --strict
