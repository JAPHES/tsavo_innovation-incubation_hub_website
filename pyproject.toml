[project]
name = "tsavo-innovation-incubation-hub"
version = "1.0.0"
description = "Institutional website for the Tsavo Innovation & Incubation Hub"
requires-python = "==3.12.*"
dependencies = [
    "Django>=5.2,<5.3",
    "Pillow>=11,<14",
    "python-dotenv>=1,<2",
    "dj-database-url>=2,<4",
    "psycopg[binary]>=3.2,<4",
    "vercel>=0.12,<1",
    "django-axes==9.0.0",
    "django-mfa==4.6.1",
]

[tool.vercel]
entrypoint = "tsavo_hub.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
