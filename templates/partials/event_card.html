<article class="event-card"><time datetime="{{ event.start_datetime|date:'c' }}"><b>{{ event.start_datetime|date:"d" }}</b><span>{{ event.start_datetime|date:"M Y" }}</span></time><div><span class="event-venue"><i class="bi bi-geo-alt" aria-hidden="true"></i> {{ event.venue }}</span><h3>{{ event.title }}</h3><p>{{ event.description|truncatewords:25 }}</p>{% if event.registration_url %}<a class="text-link" href="{{ event.registration_url }}" target="_blank" rel="noopener">Registration details <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a>{% endif %}</div></article>
