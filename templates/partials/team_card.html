{% load static %}
<article class="team-card"><div class="team-photo"><img src="{% if member.photograph %}{{ member.photograph.url }}{% else %}{% static 'images/placeholders/team_member_default.jpg' %}{% endif %}" alt="{% if member.photograph %}Portrait of {{ member.full_name }}{% else %}Team member photograph placeholder{% endif %}" loading="lazy"></div><div class="team-copy"><span>{{ member.role }}</span><h3>{{ member.full_name }}</h3><p>{{ member.biography }}</p>{% if member.linkedin_url %}<a href="{{ member.linkedin_url }}" target="_blank" rel="noopener" aria-label="{{ member.full_name }} on LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>{% endif %}</div></article>
