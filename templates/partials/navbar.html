{% load static %}
<header class="site-header" data-header>
  <nav class="main-nav" aria-label="Primary navigation">
    <div class="container nav-shell">
      <div class="brand" aria-label="Tsavo Innovation and Incubation Hub">
        <img src="{% static 'images/branding/tiih_logo.png' %}" alt="Tsavo Innovation and Incubation Hub logo" width="70" height="78">
        <span><b>Tsavo Innovation &amp;<br>Incubation Hub</b></span>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu" data-nav-toggle><span class="visually-hidden">Toggle navigation</span><span aria-hidden="true">&#9776;</span></button>
      <div class="nav-menu" id="site-menu" data-nav-menu>
        <a class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'core:home' %}">Home</a>
        <a class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'core:about' %}">About Us</a>
        <a class="{% if request.resolver_match.namespace == 'services' %}active{% endif %}" href="{% url 'services:list' %}">Our Services</a>
        <a class="{% if request.resolver_match.namespace == 'projects' %}active{% endif %}" href="{% url 'projects:list' %}">Featured Innovations</a>
        <a class="{% if request.resolver_match.url_name == 'programmes_events' %}active{% endif %}" href="{% url 'core:programmes_events' %}">Programmes &amp; Events</a>
        <a class="{% if request.resolver_match.url_name == 'partnerships' %}active{% endif %}" href="{% url 'core:partnerships' %}">Partnerships</a>
        <a class="{% if request.resolver_match.namespace == 'team' %}active{% endif %}" href="{% url 'team:list' %}">Our Team</a>
        <a class="{% if request.resolver_match.namespace == 'contact' %}active{% endif %}" href="{% url 'contact:contact' %}">Contact Us</a>
        <a href="https://ttu.ac.ke/" target="_blank" rel="noopener" aria-label="Visit Taita Taveta University (opens in a new tab)">Visit TTU</a>
      </div>
    </div>
  </nav>
</header>
